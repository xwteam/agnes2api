services:
  agnes2api:
    # 镜像 tag 走 `.env` 的插值，**不写死 `:latest`**。不设 `IMAGE_TAG` 时回落 `latest`，
    # 与此前逐字同行为，所以这不是一次破坏性变更，只是**多了一个抓手**。
    # 为什么要这个抓手：`:latest` 下 `docker compose ps` 与这份文件都答不出「现在跑的是
    # 哪一版」，而 DEPLOY.md 的回滚只有一句「把 tag 钉回上一版」——**钉在哪儿此前全仓没写过**，
    # 连镜像叫什么名字文档里都查不到（五份 DEPLOY.md 与六份 README 里 `ghcr` 零命中）。
    # 用法（五份 DEPLOY.md 的「Docker 部署 → 更新」与「升级服务」两节各写了一遍）：
    #   · 升级 = 把 `.env` 里的 `IMAGE_TAG` 改成要升的版本号，再 `docker compose up -d`；
    #   · 回滚 = 改回上一版再 `up -d`。全部可用 tag 见 GHCR 的 packages 页。
    # ⚠️ `IMAGE_TAG` **刻意不进 `.env.example`**：那份文件的头一句是「列出网关认得的
    #   **每一个**环境变量」，而网关根本不读这一个——它是 compose 自己插值用的。塞进去
    #   要么让那句话当场变假，要么逼 `tests/unit/env-example-parity.test.ts` 的
    #   「反向控制：.env.example 里出现的变量不许是真源里没有的（防写错名字）」
    #   长出第二张手写豁免表。教人在哪儿写它是 DEPLOY.md 的活，不是那份模板的活。
    # ⚠️ **敲错 tag 不会当场失败**：下面那段 `build:` 会接住它，拿**当前工作树**构建出一个
    #   顶着旧版号的镜像（实测：写不存在的 `:0.2.9` ⇒ `Image not found` ⇒ `Building` ⇒
    #   `naming to ghcr.io/xwteam/agnes2api:0.2.9`），于是「回滚成功而故障依旧」。
    #   回滚前先确认那个 tag 在 registry 上真的存在——这一句在 DEPLOY.md 里也写着。
    image: ghcr.io/xwteam/agnes2api:${IMAGE_TAG:-latest}
    # ⚠️ 没有已发布镜像时（首个 release 之前，或 fork 之后），compose 会回落到本地构建。
    # 删掉这三行 ⇒ `docker compose up -d` 在那两种情形下直接失败（拉不到那个 tag）。
    # 镜像发布由 .github/workflows/docker-publish.yml 的两个触发器决定：`push` 一个
    # `v*` 标签，或在 Actions 页手动跑一次（`workflow_dispatch`）。**两个都要有人动手**，
    # 而首个标签必须等推送之后才能打（在那之前打的标签会指向不存在的提交），
    # 所以「拉不到」是**推送当天的常态**，不是边角情形。
    # ⚠️ 这句话与那份 workflow 的触发器由 tests/unit/repo-front-door.test.ts 的 (i) 钉着：
    #   那边多一个触发器而这里没跟上，就会红。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agnes2api
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      # ⚠️ **这一行与 `.env` 里的 `DATA_DIR` 绑死，而绑法是「两边各写死同一个值」，不是插值。**
      # 右半边 `/app/data` 恰好等于 `DATA_DIR` 的内置默认值（`src/entry/node.ts`）。
      # 只改 `.env` 里的 `DATA_DIR` 而不动这一行 ⇒ store.json 落进**容器可写层**：
      # `/health` 照回 ok、面板与 key 池一切正常、注册机照常补池，而 `docker compose up -d`
      # 一重建，整池 key 与面板配置一起消失，且备份下来的 `./data` 从头到尾是空的。
      # 这条失效链由 `docker-entrypoint.sh` 的挂载点探测在启动日志里点破（它是唯一的信号，
      # `/health` 不报数据落在哪儿），五份 DEPLOY.md 的「Docker 部署 → 配置」也写着
      # （那条 alert 由 `tests/unit/ops-closure.test.ts` 的
      #   「H1 五份 DEPLOY.md 的 Docker「配置」节里都有一条 alert 写着这件事」逐份钉着，
      #   而且它点名的挂载写法是**从本行现读**的：本行改了，五份文档要跟着改）。
      # ⚠️ **别顺手改成 `- ./data:${DATA_DIR:-/app/data}` 去「让变量贯通」**：
      #   `scripts/smoke-dual-runtime.sh` 从这一行**现读**容器内那段路径
      #   （`grep -oE '^[[:space:]]*-[[:space:]]*\./data:/…'`），插值形态它认不出来，
      #   冒烟会当场判「判据坏了」拒跑（那条现读由 `tests/unit/smoke-guard.test.ts` 的
      #   「(数据隔离) 认不出要吵：docker-compose.yml 里认不出 ./data 那条挂载时当场抛」钉着）。
      #   要贯通得先改那两处，而**容器内路径本来就是实现细节**，可配没有收益：
      #   运维要换的是数据落在**宿主**哪儿，那是这一行左半边的事。
      - ./data:/app/data
      # 只读挂宿主的本地时间。**它对本仓今天是空操作**，留着只是因为两参照仓的 compose
      # 都有这一行（模板形态），不是因为它修好了什么。
      # 理由：上面那行 `TZ: ${TZ:-Asia/Shanghai}` 是**无条件**设的（`:-` 连空串都回落到
      # 默认值——实测 `.env` 里写 `TZ=`，`docker compose config` 渲染出来仍是 `TZ: Asia/Shanghai`），
      # 而 `TZ` 一旦有值就压过这份文件。本机实测（node:22-alpine；把宿主那份换成 Tokyo 才分得开
      # 两条路，因为本机 `/etc/localtime` 本身就是 UTC）：
      #   · `TZ=Asia/Shanghai` + 挂载 → node 打 `GMT+0800`，**挂载被整个忽略**；
      #     不挂载 → 同一秒同一行，逐字相同 ⇒ 加不加它，应用日志的时间戳一个字都不变。
      #   · 不给 `TZ` + 挂载 → node 打 `GMT+0900` ⇒ 只有在没人设 `TZ` 时才轮到它说话。
      # ⚠️ 上一版这段注释写的是「挂了它日志时间戳才跟得上宿主」——那是**推出来的、没量过**，
      #   三条 `docker run` 就能证伪：应用侧的时区由 `TZ` 一个人说了算。
      # ⚠️ 也别指望它管住容器里的 `date`：`node:22-alpine` 不带 tzdata（`/usr/share/zoneinfo`
      #   根本不存在），musl 解不开 `Asia/Shanghai` 这个名字就回落 UTC —— 实测 `TZ` + Tokyo 挂载下
      #   `date` 打的是 `UTC`。要 shell 侧也跟上得装 tzdata，那是另一件事，本仓没做。
      # ⇒ 这条挂载唯一会生效的情形是「有人把上面那行 `TZ` 删掉」。那个前提由
      #   tests/unit/repo-front-door.test.ts 的 (k) 钉着：`TZ` 那行没了而这段话还在 ⇒ 红。
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      # ⚠️ 这一份与 Dockerfile 里那条 HEALTHCHECK 是**两处、有意重复**：镜像内那条只在
      # 用这个镜像时生效，compose 这一份则连 `build:` 回落出来的本地镜像一起管住，
      # 且它的参数在仓里读得到、改得动，不用重建镜像。判据同一套：容器内自己发 HTTP。
      # 用 exec 形态而不是 CMD-SHELL：端口由 node 自己从 `PORT` 读，不经过 shell 展开，
      # 也就不必去处理 compose 的 `$` 转义。
      # 四个参数与 Dockerfile 那条逐个相同（两参照仓的 compose 与各自 Dockerfile 也是这个关系）：
      # 同一件事的两份副本给不同的数，只会让「容器多久才算 unhealthy」变成一个要先查
      # 「这次跑的是哪一份」才答得出的问题。
      # ⚠️ 这句「逐个相同」从落地那天起很长一段时间里**没有任何判据看着**：改一边不改
      #   另一边，CI 那一串门禁与 prepush 的逐格表一格都不会红。现在由
      #   tests/unit/repo-front-door.test.ts 的 (l) 钉着 —— 四个参数逐个比、探针命令整串比，
      #   Dockerfile 那边多出一个这里没有的参数同样红。**改这五行必须两份一起改。**
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
