services:
  agnes2api:
    image: ghcr.io/xwteam/agnes2api:latest
    # ⚠️ 没有已发布镜像时（首个 release 之前，或 fork 之后），compose 会回落到本地构建。
    # 删掉这三行 ⇒ `docker compose up -d` 在那两种情形下直接失败（拉不到那个 tag）。
    # 镜像发布只在打 `v*` 标签时触发，而首个标签必须等推送之后才能打
    # （在那之前打的标签会指向不存在的提交），所以「拉不到」是**推送当天的常态**，不是边角情形。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agnes2api
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
