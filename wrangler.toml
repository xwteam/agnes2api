name = "agnes2api"
main = "src/entry/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "POOL"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 注册机（P2，默认关闭）的补池调度：每 30 分钟触发一次 scheduled()，与
# TEND_INTERVAL_MS 的默认值（1_800_000ms）一致。REGISTRAR_ENABLED=false 时
# scheduled() 会在 buildTendDeps 里提前返回 null，触发器空转不产生副作用。
#
# 墙钟预算：受 Cloudflare Cron Trigger 单次调用 15 分钟（900s）墙钟上限约束——
# `ctx.waitUntil()` 不会延长这个上限（那个宽限只对 HTTP 请求有效）。CPU 时间上限
# 30 秒不是瓶颈，因为 await 网络 I/O 不计入 CPU 时间。
#
# 注册机链路上每个 HTTP 请求都有 15 秒的单请求超时（src/core/registrar/types.ts 的
# REGISTRAR_REQUEST_TIMEOUT_MS），下面两个估算都以它为前提——没有它，一个挂起的
# 连接就能让单轮无限拖长：
#   常态：MINT_BATCH（默认 5）× CODE_TIMEOUT_MS（默认 120s）+ 铸 key 间隔延时
#         ≈ 600~620 秒，余量约 30%。
#   理论最坏：单次铸 key ≈ CODE_TIMEOUT_MS + (1 + 3×MAX_DOMAIN_ATTEMPTS + 3) × 15s
#         ≈ 540 秒，乘以 MINT_BATCH 后远超 900 秒——默认配置在极端情况下会被平台
#         中止，这是有意接受的：每铸出一把 key 就立即落库，中止只让当轮不完整。
# 调大 MINT_BATCH / CODE_TIMEOUT_MS / MAX_DOMAIN_ATTEMPTS 前先按这两个公式核算。
[triggers]
crons = ["*/30 * * * *"]

# GATEWAY_TOKEN 是必填的敏感值，不要写进本文件（会被提交到仓库）。
# 本地开发：在 .env.example 旁新建 .dev.vars（已 gitignore），写入 GATEWAY_TOKEN=...
# 生产部署：wrangler secret put GATEWAY_TOKEN
