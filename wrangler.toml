name = "agnes2api"
main = "src/entry/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "POOL"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 注册机（默认关闭）的补池调度：每 30 分钟触发一次 scheduled()，与
# TEND_INTERVAL_MS 的默认值（1_800_000ms）一致。
#
# ⚠ **不用注册机也不要删掉这个触发器。** scheduled() 在判断「注册机是否启用」
# **之前**先做一次 key 池索引对账（src/entry/worker.ts），那是索引残留（孤儿记录 /
# 幽灵索引项）唯一的修复路径，与 REGISTRAR_ENABLED 无关。删掉之后残留永远修不好，
# 而且没有任何日志会提示你。
#
# REGISTRAR_ENABLED=false 时 scheduled() 仍会读一次配置、再读一次存储做对账
#（索引不存在时还会写一次），但不会触达邮箱服务或 Agnes——「空转」指的是
# **不产生外部副作用**，不是一次存储访问都没有。
#
# 墙钟预算：受 Cloudflare Cron Trigger 单次调用 15 分钟（900s）墙钟上限约束——
# `ctx.waitUntil()` 不会延长这个上限（那个宽限只对 HTTP 请求有效）。CPU 时间上限
# 30 秒不是瓶颈，因为 await 网络 I/O 不计入 CPU 时间。
#
# 注册机链路上每个 HTTP 请求都有 15 秒的单请求超时（src/core/registrar/types.ts 的
# REGISTRAR_REQUEST_TIMEOUT_MS），下面两个估算都以它为前提——没有它，一个挂起的
# 连接就能让单轮无限拖长：
#   常态：MINT_BATCH（默认 5）× CODE_TIMEOUT_MS（默认 120s）
#         + (MINT_BATCH - 1) × MINT_DELAY_MAX_MS（默认 90s）≈ 960 秒。
#   最坏：验证码一直收不到时，每个名额都要等满一次 CODE_TIMEOUT_MS，同一个式子：
#         MINT_BATCH × CODE_TIMEOUT_MS + (MINT_BATCH - 1) × MINT_DELAY_MAX_MS = 960 秒。
#         注①：名额之间那几段间隔从前只有几秒，可以忽略；MINT_DELAY_MIN/MAX_MS 的
#         内置取值改成 60s / 90s 之后它占 360 秒，必须算进来。
#         注②：这里从前还乘着一个「通道数」——两条邮箱通道是主备、code_timeout 会降级到
#         备通道，同一个名额要在两条通道上各等满一次（1200 秒 > 900 秒）。两条通道
#         改成二选一之后没有第二次等待了，那个因子整个消失。
#         注③：960 秒**已经超过 900 秒的墙钟上限**——这不是新缺陷，下面那个轮级预算
#         正是为它准备的：Worker 上最坏跑得完 4 个名额，第 5 个留给下一轮
#         （走 registrar.round_budget_exhausted，不是崩、也不是静默）。
#
# 因此 scheduled() 给 tendOnce 传了一个**轮级墙钟预算**
#（src/entry/worker.ts 的 TEND_ROUND_BUDGET_MS = 780s）：每次开始一次铸 key 之前先
# 判断剩余预算能否装下完整的一次
#（CODE_TIMEOUT_MS + (MAX_DOMAIN_ATTEMPTS - 1) × MINT_DELAY_MAX_MS，再加上名额之间
# 那一段间隔），装不下就
# 根本不开始、提前收尾。这样单轮不会被平台从中间砍断——被砍断时 mintOne 的 finally
# 不执行，那个临时邮箱就漏了。MINT_BATCH 在 Worker 上因此是「单轮上限」而非保证值。
# Node/Docker 没有平台墙钟上限，不传预算，MINT_BATCH 照常跑满。
#
# 预算判据算的是 CODE_TIMEOUT_MS 加上一次尝试之内换域名要付的间隔；单次尝试还会
# 花掉若干个 15 秒的单请求超时，那正是 780s 与 900s 之间那 120 秒余量的用途。
#（这一段从前写的是「与 403 退避」——那条 403 分支已经删掉了：撞上限流现在是
# 当场结束整轮 + 记一个跨轮退避，不再有「等一下接着打」这回事。）「每个请求都挂满
# 15 秒」这种病态情形仍可能顶到上限，这一条是早先就存在并已接受的取舍：每铸出
# 一把 key 就立即落库，中止只让当轮不完整。
[triggers]
crons = ["*/30 * * * *"]

# GATEWAY_TOKEN 是必填的敏感值，不要写进本文件（会被提交到仓库）。
# 本地开发：在 .env.example 旁新建 .dev.vars（已 gitignore），写入 GATEWAY_TOKEN=...
# 生产部署：wrangler secret put GATEWAY_TOKEN
