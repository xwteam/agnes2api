name: Build and Push Docker Image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # ⚠️ **不给上限，这一格就会静静烧到 GitHub 的 360 分钟默认值再被掐掉。**
    # 实测发生过一次：同一棵树、同一份 Dockerfile、同一个 QEMU，
    # 一次冷构建 108 秒跑完，另一次卡在 `build-push-action` 直到 360 分钟被 cancelled，
    # 而同条件重跑又是 2 分 20 秒 —— 是 runner 侧的偶发故障，仓库这边一个字节都没差。
    # 真正的教训不是「去修构建」，是**那 298 分钟里没有任何东西报过一声**：
    # 结果不是「构建失败」而是「镜像悄悄没发出去」，而 Release 已经发了。
    # 30 分钟是正常值（2 分钟量级）的十倍余量，卡住时它会当场红而不是烧满六小时。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 跨构建复用层缓存（依赖安装等），后续构建更快。
          cache-from: type=gha
          cache-to: type=gha,mode=max
