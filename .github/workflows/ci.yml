name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 凭据扫描
        run: bash scripts/scan-secrets.sh
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元与契约测试（Node 运行时）
        run: pnpm test
      - name: 契约测试（workerd 运行时）
        run: pnpm test:workers
