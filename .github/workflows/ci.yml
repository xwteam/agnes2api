name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # ⚠️ **下面这一行（全克隆）是历史凭据扫描的前提，两件事必须一起在场。**
        # 默认的浅克隆里 `git rev-parse --is-shallow-repository` 回 true，而
        # `scripts/scan-secrets.sh` 的历史那一档对浅仓是**按失败处理**的：
        # 删了它历史扫描会 fail closed（**不是静默放行**）——每次 CI 都会红在
        # 「拿不到全部历史」上，而不是悄悄地一个历史对象都不扫。
        # 代价：全克隆要多拉整个 `.git`（本仓今天是几十 MB 量级），可接受。
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # **评审 F3 新增，排第一位**：跟踪文件不许被 git 判定为二进制。放在
      # scan-secrets 之前是有意为之——scan-secrets 用 `git grep` 扫凭据，对二进制
      # 文件天然会打折扣（即便去掉了 -I，也不该让"文件是不是文本"这件事本身要靠
      # 扫凭据的副作用去兜底）；这一步先把"是不是文本"这个前提确认掉，后面的
      # 评审包 diff、代码审计 grep、五语言 grep 核对、scan-secrets 才都建立在
      # 同一个成立的前提上。起因见 scripts/check-no-binary.mjs 文件头。
      - name: 1/13 跟踪文件不许是二进制
        run: node scripts/check-no-binary.mjs
      # 紧挨着上一步，因为它俩是**同一个决定的两半**：上一步对 docs/logo.png 开了一个
      # 具名放行（模板要求 README 头部块摆这张图），放行让出的那块——"这个文件里藏没藏
      # 东西"——由这一步逐字节接回去：签名 / 逐块 CRC / 块类型黑白名单 / IEND 之后零
      # 尾随字节 / sha256 与登记值一致 / 尺寸 / 体积 / 完全透明像素占比。
      # 排在凭据扫描之前，理由与上一步相同：凭据扫描对"被压过一道的字节"和"不长成那六条
      # 形态的东西"读不到（本机实测，逐档数据在 scripts/check-png.mjs 文件头），
      # 所以进仓的那个二进制文件必须先被单独审一遍，而不是指望后面某一步顺带兜底。
      - name: 2/13 具名放行的 PNG 结构审计
        run: node scripts/check-png.mjs
      # 凭据扫描跑两条命令：第一条只扫工作树，第二条是它的**超集**（工作树，再加可达
      # 历史：blob / 提交信息 / 标签说明）。工作树因此被扫两遍，那是有意留着的：红出来
      # 的时候，一眼能分清是工作树回归，还是历史那笔欠账。
      # 历史那一档不是锦上添花——`git push` 发的是历史、不是工作树，一个凭据只要进过
      # 一个提交，哪怕下一个提交就把它删掉，工作树那一档一个字都看不见。
      # 它已知的盲区与欠账逐条写在 `scripts/scan-secrets.sh` 文件头。
      # 两条命令写在同一个 run 块里，`shell: bash` 是**显式**声明的：要的是 `-e`
      # （第一条失败就中断），不去赌 runner 默认 shell 带不带它。
      # ⚠️ **历史那一档今天是绿的**：历史里那笔泄漏已经在一次性历史重写里清干净了
      #    （全历史 0 命中，本机实测这一档 exit 0）。⇒ **它再红就是新回归**，
      #    多半是某个新提交的提交信息、或某个已删文件留在历史里的 blob；
      #    处置是把那几个提交改掉，不是再做一次历史重写，也不是放宽这道门禁。
      # ⚠️ **这句话写在注释里没用**：`#` 注释进不了 Actions 日志，第一个看到红 CI 的人
      #    只会拿到 stderr 那几行 ❌。所以历史那一条的失败在下面补了一条 `::error::`
      #    注解，把"这一档红意味着什么、该去动哪里"写进日志本身。
      #    工作树那一条刻意**不**加注解：两档的处置不同，不该被同一句话盖住。
      # ⚠️ **这一档红的时候会把命中的原文逐字打进 Actions 日志，而公开仓的 Actions 日志
      #    是世界可读的**（本机实测过一次：历史里那个私有部署地址被这一步的 stderr 反复
      #    打了出来。条数会随每次提交漂，没人守得住，所以这里不写死一个数——要看就自己
      #    跑一次）。推出去的历史本身同样是公开的，日志只是把它照抄一遍 ——
      #    所以处置永远是**先把历史里那条命中弄干净再推**，而不是把这道门禁的输出藏起来。
      - name: 3/13 凭据扫描
        shell: bash
        run: |
          bash scripts/scan-secrets.sh
          bash scripts/scan-secrets.sh --history || {
            rc=$?
            echo "::error::历史档失败。历史里那笔泄漏已经在一次性历史重写里清干净了（那之后全历史 0 命中），所以这一档红是新回归：多半是某个新提交的提交信息、或某个已删文件留在历史里的 blob。处置是把那几个提交改掉，不是再做一次历史重写，也不是放宽这道门禁。命中的原文见本步骤 stderr，边界与欠账见 scripts/scan-secrets.sh 文件头"
            exit $rc
          }
      - name: 4/13 生成面板资源
        run: node scripts/build-ui.mjs
      - name: 5/13 生成物一致性（仓库里那份必须与 admin-ui/ 一致）
        run: git diff --exit-code src/ui/assets.generated.ts
      - name: 6/13 面板体积预算
        run: node scripts/check-ui-budget.mjs
      - name: 7/13 i18n 完整性
        run: node scripts/check-i18n.mjs
      - name: 8/13 KV namespace id 仍是占位符
        run: node scripts/check-wrangler-placeholder.mjs
      # 全分支评审 B2 新增的这一道：**注释里指向的位置必须真实存在。**
      # 排在类型检查之前是有意为之——它只读文本、几百毫秒就跑完，而它抓的那类缺陷
      # （「这条由 X 用例钉着」指向一条根本不存在的用例）恰恰是**读代码的人会当真、
      # 而所有其它门禁都看不见**的那一类。本仓台账已为它记了二十余次。
      - name: 9/13 注释里的指向必须解析得开
        run: node scripts/check-comment-refs.mjs
      - name: 10/13 类型检查
        run: pnpm typecheck
      # 下面 `pnpm test 2>&1` / `pnpm test:workers 2>&1` 这两处**不得**追加任何
      # 文件路径过滤器（如 `pnpm test tests/foo.test.ts`）。tests/global-setup.ts 里
      # 的收集门禁按「带没带过滤器」分档，一旦 CI 带了过滤器，门禁会在**不报错、不提示**
      # 的情况下静默跳过——这个前提由 tests/unit/scripts-guard.test.ts 钉住，改这两行前
      # 先去看那份测试。
      #
      # 门禁本身是否真的跑过，光看 `pnpm test` 的退出码看不出来（静默跳过时退出码同样是
      # 0）。所以下面用 tee 把输出落一份日志，再 grep 收集门禁自己打的成功横幅
      # `[collection-guard] ✅`——横幅缺失就说明门禁没跑，即使测试全绿也要让这一步失败。
      #
      # 这里**不**在 CI 层重新做一遍「磁盘清单 vs 实际收集」的比对：那套比对已经在
      # tests/global-setup.ts 里逐配置（node 一份、workerd 一份，各自独立核对，不取并集）
      # 实现过一次，CI 只需要确认它被跑到——重新实现一遍等于多一处可能出现同一类并集
      # 语义盲区的地方。
      - name: 11/13 单元 / 契约 / 前端纯函数测试（Node 运行时）
        shell: bash
        run: |
          pnpm test 2>&1 | tee /tmp/test-node.log
          grep -qF '[collection-guard] ✅' /tmp/test-node.log || {
            echo "::error::收集门禁没有跑过（日志里没见到 [collection-guard] ✅），它可能被静默跳过了"
            exit 1
          }
      - name: 12/13 契约测试（workerd 运行时）
        shell: bash
        run: |
          pnpm test:workers 2>&1 | tee /tmp/test-workers.log
          grep -qF '[collection-guard] ✅' /tmp/test-workers.log || {
            echo "::error::收集门禁没有跑过（日志里没见到 [collection-guard] ✅），它可能被静默跳过了"
            exit 1
          }
      - name: 13/13 构建
        run: pnpm build
