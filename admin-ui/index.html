<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<title>agnes2api 管理后台</title>
<!-- 唯一的经典脚本，必须同步、必须在 CSS 之前：防闪白 / 闪错语言。 -->
<script src="/admin/js/boot.js"></script>
<link rel="stylesheet" href="/admin/css/base.css">
<link rel="stylesheet" href="/admin/css/shell.css">
<link rel="stylesheet" href="/admin/css/sections.css">
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-card" id="gate-form">
    <h1 data-i18n="gate.title">agnes2api 管理后台</h1>
    <p class="sub" data-i18n="gate.sub">请输入管理口令（ADMIN_TOKEN）</p>
    <label for="gate-key" data-i18n="gate.label">管理口令</label>
    <input id="gate-key" type="password" autocomplete="current-password"
           data-i18n-ph="gate.placeholder" placeholder="ADMIN_TOKEN">
    <button type="submit" data-i18n="gate.submit">进入</button>
    <div class="err" id="gate-err" role="alert"></div>
  </form>
</div>

<div class="shell" id="shell">
  <aside class="side">
    <div class="brand">agnes2api</div>
    <nav>
      <button class="nav-item" data-section="overview" data-i18n="nav.overview">概览</button>
      <button class="nav-item" data-section="keys" data-i18n="nav.keys">Key 池</button>
      <button class="nav-item" data-section="registrar" data-i18n="nav.registrar">注册机</button>
      <button class="nav-item" data-section="events" data-i18n="nav.events">事件</button>
    </nav>
    <div class="side-foot">
      <select id="lang-select" data-i18n-title="shell.lang"></select>
      <button id="theme-btn" class="icon-btn" data-i18n-title="shell.theme"></button>
      <button id="logout-btn" class="icon-btn" data-i18n-title="shell.logout"></button>
    </div>
  </aside>
  <main class="main">
    <section class="section" id="sec-overview"></section>
    <section class="section" id="sec-keys"></section>
    <section class="section" id="sec-registrar"></section>
    <section class="section" id="sec-events"></section>
  </main>
</div>

<div id="toast-host" class="toast-host" aria-live="polite"></div>
<script type="module" src="/admin/js/app.js"></script>
</body>
</html>
