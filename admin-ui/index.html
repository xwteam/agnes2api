<!-- 唯一的经典脚本，必须同步、必须在 CSS 之前：防闪白 / 闪错语言。 -->
<script src="/admin/js/boot.js"></script>
<link rel="stylesheet" href="/admin/css/base.css">
<link rel="stylesheet" href="/admin/css/shell.css">
<link rel="stylesheet" href="/admin/css/sections.css">
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-card" id="gate-form">
    <!-- 登录闸的品牌区与主题切换。**主题切换在登录之前就得有**：`js/boot.js` 已经
         按 localStorage 把 data-theme 落到 <html> 上了，深色用户看到的登录闸本来就是
         深色的，而在这里改不了它——顶栏那颗按钮要登录之后才够得着。
         ⚠️ **这里刻意没有语言下拉**：`js/i18n.js` 在模块加载时就读 localStorage 定好了
         语言，登录闸的每一句文案（含下面那些 data-i18n）都已经按那个语言渲染，
         所以语言在闸上是**可用**的；不放下拉是因为它与顶栏那个是同一份状态的第二个
         入口，而闸上五种语言的文案本来就齐全，看不懂的人换不换得了语言不取决于这里。 -->
    <div class="gate-head">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">agnes2api</span>
      </span>
      <button id="gate-theme-btn" class="icon-btn" type="button" data-i18n-title="shell.theme"></button>
    </div>
    <h1 data-i18n="gate.title">agnes2api 管理后台</h1>
    <p class="sub" data-i18n="gate.sub">请输入管理口令（ADMIN_TOKEN）</p>
    <label for="gate-key" data-i18n="gate.label">管理口令</label>
    <input id="gate-key" type="password" autocomplete="current-password"
           data-i18n-ph="gate.placeholder" placeholder="ADMIN_TOKEN">
    <button type="submit" data-i18n="gate.submit">进入</button>
    <div class="err" id="gate-err" role="alert"></div>
  </form>
</div>

<div class="shell" id="shell">
  <!-- 顶栏。品牌 / 语言 / 主题 / 退出登录 / 仓库链接都挂在这里，侧栏只剩导航。
       ⚠️ **刻意没有「重启」按钮**（kiro2api 的顶栏上有一个）：本网关的 Worker 形态
       压根没有可重启的进程（概览页那几格自己写着「无常驻进程」），Node / Docker 形态
       也没有任何自重启接口。点了没反应的按钮比没有按钮更糟。
       ⚠️ 两颗图标按钮的图标由 `js/app.js` 用 `svgIcon()` 插进来，**这里刻意是空的**：
       图标一律内联 SVG（admin-ui/README.md 硬规则 2），而 `js/ui.js` 的 `svgIcon()` 是
       全站唯一那份构造 SVG 的实现，在 HTML 里再手抄一份 path 就是第二份真源。
       ⚠️ **空标签本身曾经就是缺陷**：这两颗按钮以前只有 `data-i18n-title`（悬停才有
       提示），`innerHTML` 是空串 ⇒ 屏幕上是两个 32×32 的空方块。 -->
  <header class="topbar">
    <!-- 品牌标记是一个空的 <span>，图画在 admin-ui/css/shell.css 的 `.brand-mark`
         背景上（那张图就是 docs/logo.png 缩到 64×64）。**刻意不是 <img>**：顶栏与
         登录闸两处标记共用 CSS 里那一份 base64，写成 <img> 就要在 HTML 里各存一遍
         同样的字节——体积预算多吃一份，还多一处会漂的真源。
         `aria-hidden` 是因为它右边那个 .brand-name 已经把品牌名读出来了。 -->
    <span class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">agnes2api</span>
    </span>
    <!-- 服务状态徽章。数据源是 `/health`（不鉴权、零存储 IO），三档：运行中 / 降级 /
         状态未知。**初始文案就是「状态未知」**：这一刻还没探过，写成「运行中」等于
         凭空断言一件没验过的事。它是一颗按钮，点一下重新探——徽章说的是「最近一次
         探测」，不是「此刻」。 -->
    <button id="health-badge" class="badge health-badge" type="button"
            data-i18n="shell.status.unknown" data-i18n-title="shell.status.hint">状态未知</button>
    <div class="topbar-actions">
      <a class="topbar-link" href="https://github.com/xwteam/agnes2api"
         target="_blank" rel="noopener noreferrer" data-i18n-title="shell.repo">GitHub</a>
      <select id="lang-select" data-i18n-title="shell.lang"></select>
      <button id="theme-btn" class="icon-btn" type="button" data-i18n-title="shell.theme"></button>
      <button id="logout-btn" class="icon-btn" type="button" data-i18n-title="shell.logout"></button>
    </div>
  </header>
  <aside class="side">
    <nav>
      <!-- 每个导航项 = 一颗 emoji + 一个带 data-i18n 的文字 span。
           **文字必须自己占一个 span**：`js/i18n.js` 的 `apply()` 对 [data-i18n] 写的是
           `el.textContent = t(key)`，标在按钮上会把图标一起抹掉。 -->
      <button class="nav-item" data-section="overview"><span class="nav-ico" aria-hidden="true">📊</span><span data-i18n="nav.overview">概览</span></button>
      <button class="nav-item" data-section="keys"><span class="nav-ico" aria-hidden="true">🔑</span><span data-i18n="nav.keys">Key 池</span></button>
      <button class="nav-item" data-section="registrar"><span class="nav-ico" aria-hidden="true">🤖</span><span data-i18n="nav.registrar">注册机</span></button>
      <button class="nav-item" data-section="events"><span class="nav-ico" aria-hidden="true">📜</span><span data-i18n="nav.events">事件</span></button>
      <button class="nav-item" data-section="usage"><span class="nav-ico" aria-hidden="true">📈</span><span data-i18n="nav.usage">用量</span></button>
      <button class="nav-item" data-section="models"><span class="nav-ico" aria-hidden="true">🧩</span><span data-i18n="nav.models">模型</span></button>
      <button class="nav-item" data-section="playground"><span class="nav-ico" aria-hidden="true">🧪</span><span data-i18n="nav.playground">调试台</span></button>
      <button class="nav-item" data-section="settings"><span class="nav-ico" aria-hidden="true">⚙️</span><span data-i18n="nav.settings">设置</span></button>
    </nav>
  </aside>
  <main class="main">
    <section class="section" id="sec-overview"></section>
    <section class="section" id="sec-keys"></section>
    <section class="section" id="sec-registrar"></section>
    <section class="section" id="sec-events"></section>
    <section class="section" id="sec-usage"></section>
    <section class="section" id="sec-models"></section>
    <section class="section" id="sec-playground"></section>
    <section class="section" id="sec-settings"></section>
  </main>
</div>

<div id="toast-host" class="toast-host" aria-live="polite"></div>
<script type="module" src="/admin/js/app.js"></script>
</body>
</html>
